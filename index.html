<!DOCTYPE html?>
<head>
  <title>My Online Portfolio</title>
  <meta charset = "UTF-8"> <! these three (following) lines are required when using chat.js
  <meta name = "viewport" content = "width=device-width, initial-scale=1.0"> 
  <script scr="https://cdn.jddelivr.net/npm/chart.js"></script>
  <style>
    .chart-container{
      width:90%;
      max-width:800px
      margin:30px auto;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">My Online Portfolio</h1>
  <p style="text-align:center;">I'm Shanyk and this is my practice webpage.</p>
  <div style="text-align:center;" class="image">
    <img src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSg_xR4nLv7eZzSIvNqtV_c5L4zrzeraEw4bs_lKHilDg&s=10">
  </div>
  <div class = "chart-container" >
    <canvas id = chart></canvas>
  </div>
  <script>
  const ctx=document.getElementById("chart");
  new Chart(ctx, {
    type: "line",
      data: {
          labels:["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          datasets:[{
            label:"Coffee Spending",
            data:[6.00,12.00,12.00,18.00,18.00],
            
            borderColor: "#FF0154",
            backgroundColor: "#E3DCDC",
            borderWidth:3,
            fill: true, 
            tension:0.35,
            pointRadius:4,
            pointBackgroundColor:"FF0155"
          }]
      },
      options:{
        responsive:true, 
        maintainAspectRatio:true,

        plugins:{
          legend:{
            display:true
          }
        },
        scales:{
          y:{
            beginAtZero:true
          }
        }
      }
  });
  </script>
</body>
</html>
