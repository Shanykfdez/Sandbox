<!DOCTYPE html?>
<head>
  <title>Halloween Candies</title>
  <meta charset = "UTF-8"> <! these three (following) lines are required when using chat.js>
  <meta name = "viewport" content = "width=device-width, initial-scale=1.0"> 
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    .chart-container{
      width:90%;
      max-width:800px;
      margin:30px auto;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Popularity of Halloween Candies Throughout the Years</h1>
  <p style="text-align:center;">Are these candies a trick, or a real treat?</p>
  <div style="text-align:center;" class="image">
    <img src = "https://substackcdn.com/image/fetch/$s_!_Nkm!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faaf2b165-d2b5-4f1b-99db-e1721277c898_1024x1024.png" width="400" height="400">
  </div>
  <div class = "chart-container" >
    <canvas id = chart></canvas>
  </div>
  <script>
  const ctx=document.getElementById("chart");
  new Chart(ctx, {
    type: "line",
      data: {
          labels:["2016", "2018", "2020", "2022", "2024", "2026"],
          datasets:[{
            label:"People Who Actually Like Candy Corn (%)",
            data:[68.00, 55.00, 42.00, 35.00, 21.00, 12.00],
            
            borderColor: "#FF9800",
            backgroundColor: "#E3DCDC",
            borderWidth:3,
            fill: true, 
            tension:0.35,
            pointRadius:4,
            pointBackgroundColor:"#FF0155"
          }]
      },

  const candyTypeCtx = document.getElementById("candyTypeChart");
new Chart(candyTypeCtx, {
    type: "bar",
    data: {
        labels: ["Chocolate Bars", "Sour Gummy Candies", "Fruity Chews", "Candy Corn", "Caramels/Toffees"],
        datasets: [{
            label: "Preferred Candy Type in 2026 (%)",
            data: [45.5, 22.0, 16.5, 4.0, 12.0],
            backgroundColor: [
                "#4A2E2B",
                "#9C27B0",
                "#FF5722",
                "#FFEB3B",
                "#FF9800"
            ],
            borderColor: "#1A1A1A",
            borderWidth: 2
        }]
    },
  
      options:{
        responsive:true, 
        maintainAspectRatio:true,

        plugins:{
          legend:{
            display:true
          }
        },
        scales:{
          y:{
            beginAtZero:true
          }
        }
      }
  });
  </script>
</body>
</html>
